/* =====================================================
CREAR TEXTURA DE CADA FRASE
===================================================== */

function createTextTexture(text) {

const canvas =
document.createElement(
"canvas"
);

const ctx =
canvas.getContext(
"2d"
);

const width =
900;

const height =
180;

canvas.width =
width;

canvas.height =
height;

/*
Fondo transparente
*/

ctx.clearRect(
0,
0,
width,
height
);

/*
Caja translúcida
*/

ctx.fillStyle =
"rgba(5,15,35,.55)";

roundRect(
ctx,
10,
10,
width - 20,
height - 20,
30
);

ctx.fill();

/*
Borde
*/

ctx.strokeStyle =
"rgba(147,197,253,.45)";

ctx.lineWidth =
3;

roundRect(
ctx,
10,
10,
width - 20,
height - 20,
30
);

ctx.stroke();

/*
Texto
*/

ctx.font =
"bold 27px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.shadowColor =
"#3b82f6";

ctx.shadowBlur =
12;

ctx.fillStyle =
"#dbeafe";

/*
Ajustar texto en varias líneas
*/

const words =
text.split(" ");

let lines = [];

let current =
"";

const maxWidth =
810;

for (
const word of words
) {

const test =
current
? current + " " + word
: word;

if (
ctx.measureText(
test
).width >
maxWidth
) {

lines.push(
current
);

current =
word;

}

else {

current =
test;

}

}

if (current)
lines.push(
current
);

const lineHeight =
35;

const startY =
height / 2 -
(
(lines.length - 1) *
lineHeight
) / 2;

lines.forEach(
(line,index) => {

ctx.fillText(
line,
width / 2,
startY +
index *
lineHeight
);

}
);

return canvas;

}

/* =====================================================
RECTÁNGULO REDONDEADO
===================================================== */

function roundRect(
ctx,
x,
y,
width,
height,
radius
) {

ctx.beginPath();

ctx.moveTo(
x + radius,
y
);

ctx.lineTo(
x + width - radius,
y
);

ctx.quadraticCurveTo(
x + width,
y,
x + width,
y + radius
);

ctx.lineTo(
x + width,
y + height - radius
);

ctx.quadraticCurveTo(
x + width,
y + height,
x + width - radius,
y + height
);

ctx.lineTo(
x + radius,
y + height
);

ctx.quadraticCurveTo(
x,
y + height,
x,
y + height - radius
);

ctx.lineTo(
x,
y + radius
);

ctx.quadraticCurveTo(
x,
y,
x + radius,
y
);

ctx.closePath();

}

/* =====================================================
INTERACCIÓN
===================================================== */

let dragging =
false;

let previousX =
0;

let previousY =
0;

let targetRotationX =
0;

let targetRotationY =
0;

let rotationX =
0;

let rotationY =
0;

/* =========================================
TOCAR / ARRASTRAR
========================================= */

renderer.domElement.addEventListener(
"pointerdown",
event => {

dragging =
true;

previousX =
event.clientX;

previousY =
event.clientY;

renderer.domElement.setPointerCapture(
event.pointerId
);

}
);

renderer.domElement.addEventListener(
"pointermove",
event => {

if (!dragging)
return;

const dx =
event.clientX -
previousX;

const dy =
event.clientY -
previousY;

targetRotationY +=
dx * .009;

targetRotationX +=
dy * .009;

/*
Evita que se voltee
demasiado verticalmente
*/

targetRotationX =
THREE.MathUtils.clamp(
targetRotationX,
-Math.PI / 2,
Math.PI / 2
);

previousX =
event.clientX;

previousY =
event.clientY;

}
);

renderer.domElement.addEventListener(
"pointerup",
event => {

dragging =
false;

try {

renderer.domElement
.releasePointerCapture(
event.pointerId
);

} catch {}

}
);

/* =====================================================
ZOOM CON RUEDA
===================================================== */

renderer.domElement.addEventListener(
"wheel",
event => {

camera.position.z +=
event.deltaY *
.025;

camera.position.z =
THREE.MathUtils.clamp(

camera.position.z,

18,

65

);

},
{
passive: true
}
);

/* =====================================================
ZOOM CON PINCH
===================================================== */

let lastTouchDistance =
null;

renderer.domElement.addEventListener(
"touchmove",
event => {

if (
event.touches.length !== 2
)
return;

const a =
event.touches[0];

const b =
event.touches[1];

const dx =
a.clientX -
b.clientX;

const dy =
a.clientY -
b.clientY;

const distance =
Math.sqrt(
dx * dx +
dy * dy
);

if (
lastTouchDistance !==
null
) {

const difference =
distance -
lastTouchDistance;

camera.position.z -=
difference *
.025;

}

lastTouchDistance =
distance;

camera.position.z =
THREE.MathUtils.clamp(

camera.position.z,

18,

65

);

},
{
passive: true
}
);

renderer.domElement.addEventListener(
"touchend",
() => {

lastTouchDistance =
null;

}
);

/* =====================================================
ANIMACIÓN
===================================================== */

const clock =
new THREE.Clock();

function animate() {

requestAnimationFrame(
animate
);

const time =
clock.getElapsedTime();

/*
========================================
ROTACIÓN SUAVE
========================================
*/

rotationX +=
(
targetRotationX -
rotationX
) * .08;

rotationY +=
(
targetRotationY -
rotationY
) * .08;

/*
Rotación automática
*/

if (!dragging) {

targetRotationY +=
.0018;

}

world.rotation.x =
rotationX;

world.rotation.y =
rotationY;

/*
========================================
LATIDO
========================================
*/

const heartbeat =
1 +

Math.sin(
time * 4
) *
.035 +

Math.sin(
time * 8
) *
.012;

heartGroup.scale.set(
heartbeat,
heartbeat,
heartbeat
);

/*
========================================
MOVIMIENTO DE PARTÍCULAS
========================================
*/

const pos =
heartGeometry.attributes
.position.array;

for (
let i = 0;
i < PARTICLE_COUNT;
i++
) {

const i3 =
i * 3;

const ox =
originalPositions[i3];

const oy =
originalPositions[i3 + 1];

const oz =
originalPositions[i3 + 2];

/*
Vibración muy pequeña
*/

pos[i3] =
ox +
Math.sin(
time * 2 +
i
) *
.025;

pos[i3 + 1] =
oy +
Math.cos(
time * 2.3 +
i
) *
.025;

pos[i3 + 2] =
oz +
Math.sin(
time * 1.7 +
i
) *
.035;

}

heartGeometry.attributes
.position
.needsUpdate =
true;

/*
========================================
FRASES 3D
========================================
*/

phraseObjects.forEach(
sprite => {

const data =
sprite.userData;

sprite.position.y =
data.baseY +

Math.sin(
time *
data.speed +
data.phase
) *
data.amplitude;

sprite.position.x =
data.baseX +

Math.cos(
time *
.3 +
data.phase
) *
.12;

sprite.position.z =
data.baseZ +

Math.sin(
time *
.4 +
data.phase
) *
.15;

/*
Brillo suave
*/

sprite.material.opacity =
.72 +

Math.sin(
time *
1.2 +
data.phase
) *
.12;

}
);

/*
========================================
PARTÍCULAS DEL ESPACIO
========================================
*/

ambientParticles.rotation.y =
time * .008;

ambientParticles.rotation.x =
Math.sin(
time * .1
) * .04;

/*
========================================
EXPLOSIONES
========================================
*/

for (
let i =
explosions.length - 1;

i >= 0;

i--
) {

const particle =
explosions[i];

const data =
particle.userData;

particle.position.add(
data.velocity
);

data.velocity.multiplyScalar(
.985
);

data.velocity.y -=
.0008;

data.life++;

particle.material.opacity =
1 -
data.life /
data.maxLife;

if (
data.life >=
data.maxLife
) {

heartGroup.remove(
particle
);

particle.geometry.dispose();

particle.material.dispose();

explosions.splice(
i,
1
);

}

}

/*
========================================
RENDER
========================================
*/

renderer.render(
scene,
camera
);

}

animate();

/* =====================================================
BOTÓN
===================================================== */

const button =
document.getElementById(
"startButton"
);

button.addEventListener(
"click",
() => {

createExplosion();

button.textContent =
"❤️ TE QUIERO ❤️";

setTimeout(
() => {

createExplosion();

},
350
);

setTimeout(
() => {

createExplosion();

},
700
);

setTimeout(
() => {

button.textContent =
"✨ Ver sorpresa";

},
3000
);

}
);

/* =====================================================
RESIZE
===================================================== */

window.addEventListener(
"resize",
() => {

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>
